name: Release skills

on:
  push:
    branches:
      - master
    paths:
      - "skills/**"
  workflow_dispatch:

concurrency:
  group: release-skills-${{ github.ref }}

jobs:
  release:
    name: Publish skill release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh skill publish --tag "v1.0.${GITHUB_RUN_NUMBER}"
